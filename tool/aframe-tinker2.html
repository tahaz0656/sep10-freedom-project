<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
     <!-- The Chassis -->
<a-box position="0 0.5 0" width="2" height="0.2" depth="3" color="#606060"></a-box>
<!-- Right Back Wheel -->
<a-cylinder position="1 0.5 1" radius="0.4" height="0.1" rotation="0 0 90" color="black"></a-cylinder>
<!-- Left Back Wheel -->
 <a-cylinder position="-1 0.5 1" radius="0.4" height="0.1" rotation="0 0 90" color="black"></a-cylinder>
 <!-- Right Front Wheel -->
  <a-cylinder position="1 0.5 -1" radius="0.4" height="0.1" rotation="0 0 90" color="black"></a-cylinder>
  <!-- Left Front Wheel -->
   <a-cylinder position="-1 0.5 -1" radius="0.4" height="0.1" rotation="0 0 90" color="black"></a-cylinder>
   <!-- DAY 2-->
<!-- The outer shell of the bin -->
<a-box position="0 0.6 -0.4" width="1.2" height="1" depth="1" color="#FFC65D"></a-box>
<!-- The "inside" of the bin (hollow look) -->
<a-box position="0 1.12 -0.4" width="1.1" height="0.1" depth="0.9" color="#222"></a-box>

<!-- DAY 2:EYES -->
<!-- Left Eye -->
<a-sphere position="-0.3 0.3 1" radius="0.1" color="white"></a-sphere>
<a-sphere position="-0.3 0.3 1.1" radius="0.04" color="red"></a-sphere>
<!-- Right Eye -->
<a-sphere position="0.3 0.3 1" radius="0.1" color="white"></a-sphere>
<a-sphere position="0.3 0.3 1.1" radius="0.04" color="red"></a-sphere>
<!-- DAY 3: COLLECTION ARM -->

  <!-- The long arm -->
  <a-box position="0 0.2 1.3" width="0.2" height="0.1" depth="0.8" color="yellow"></a-box>

  <!-- The hand (gripper) -->
  <a-box position="0 0.15 1.7" width="0.6" height="0.1" depth="0.2" color="black"></a-box>

  <!-- This makes the arm move up and down -->
  <a-animation attribute="rotation" from="0 0 0" to="-20 0 0" dur="2000" repeat="indefinite" direction="alternate"></a-animation>


      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
